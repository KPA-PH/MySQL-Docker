
name: kpa-datastores

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart-policy: &restart-policy
  restart: unless-stopped
  stop_grace_period: 60s

services:
  postgresql18:
    <<: *restart-policy
    image: postgres:18-bookworm
    container_name: postgresql18
    security_opt:
      - no-new-privileges:true
    shm_size: ${POSTGRES18_SHM_SIZE:-512mb}
    ports:
      - "${POSTGRES18_BIND_ADDRESS:-127.0.0.1}:${POSTGRES18_PORT:-5432}:5432"
    volumes:
      - ./postgresql/data-18:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES18_DB:-app}
      POSTGRES_USER: ${POSTGRES18_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES18_PASSWORD:?Set POSTGRES18_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --encoding=UTF8 --locale=C.UTF-8"
      PGDATA: /var/lib/postgresql/18/docker
      TZ: ${TZ:-Asia/Manila}
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=${POSTGRES18_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${POSTGRES18_SHARED_BUFFERS:-1536MB}
      - -c
      - effective_cache_size=${POSTGRES18_EFFECTIVE_CACHE_SIZE:-4GB}
      - -c
      - work_mem=${POSTGRES18_WORK_MEM:-16MB}
      - -c
      - maintenance_work_mem=${POSTGRES18_MAINTENANCE_WORK_MEM:-256MB}
      - -c
      - max_worker_processes=${POSTGRES18_MAX_WORKER_PROCESSES:-4}
      - -c
      - max_parallel_workers=${POSTGRES18_MAX_PARALLEL_WORKERS:-2}
      - -c
      - max_parallel_workers_per_gather=${POSTGRES18_MAX_PARALLEL_WORKERS_PER_GATHER:-2}
      - -c
      - wal_buffers=${POSTGRES18_WAL_BUFFERS:-16MB}
      - -c
      - min_wal_size=${POSTGRES18_MIN_WAL_SIZE:-1GB}
      - -c
      - max_wal_size=${POSTGRES18_MAX_WAL_SIZE:-4GB}
      - -c
      - checkpoint_completion_target=${POSTGRES18_CHECKPOINT_COMPLETION_TARGET:-0.9}
      - -c
      - log_min_duration_statement=${POSTGRES18_LOG_MIN_DURATION_STATEMENT:-1000}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: ${POSTGRES18_CPU_LIMIT:-2}
          memory: ${POSTGRES18_MEMORY_LIMIT:-6g}
        reservations:
          memory: ${POSTGRES18_MEMORY_RESERVATION:-1g}
    networks:
      - datastore

  pgbouncer:
    <<: *restart-policy
    image: edoburu/pgbouncer:v1.25.1-p0
    container_name: pgbouncer
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgresql18:
        condition: service_healthy
    ports:
      - "${PGBOUNCER_BIND_ADDRESS:-127.0.0.1}:${PGBOUNCER_PORT:-6432}:6432"
    environment:
      DB_HOST: postgresql18
      DB_PORT: 5432
      DB_USER: ${POSTGRES18_USER:-app}
      DB_PASSWORD: ${POSTGRES18_PASSWORD:?Set POSTGRES18_PASSWORD in .env}
      DB_NAME: ${POSTGRES18_DB:-app}
      AUTH_TYPE: scram-sha-256
      POOL_MODE: ${PGBOUNCER_POOL_MODE:-transaction}
      LISTEN_PORT: 6432
      MAX_CLIENT_CONN: ${PGBOUNCER_MAX_CLIENT_CONN:-1000}
      DEFAULT_POOL_SIZE: ${PGBOUNCER_DEFAULT_POOL_SIZE:-25}
      MIN_POOL_SIZE: ${PGBOUNCER_MIN_POOL_SIZE:-5}
      RESERVE_POOL_SIZE: ${PGBOUNCER_RESERVE_POOL_SIZE:-5}
      RESERVE_POOL_TIMEOUT: ${PGBOUNCER_RESERVE_POOL_TIMEOUT:-3}
      MAX_DB_CONNECTIONS: ${PGBOUNCER_MAX_DB_CONNECTIONS:-90}
      SERVER_IDLE_TIMEOUT: ${PGBOUNCER_SERVER_IDLE_TIMEOUT:-600}
      TZ: ${TZ:-Asia/Manila}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U \"$${DB_USER}\" -d \"$${DB_NAME}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: ${PGBOUNCER_CPU_LIMIT:-1}
          memory: ${PGBOUNCER_MEMORY_LIMIT:-256m}
        reservations:
          memory: ${PGBOUNCER_MEMORY_RESERVATION:-64m}
    networks:
      - datastore

networks:
  datastore:
    driver: bridge
