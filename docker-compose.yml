
name: kpa-datastores

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart-policy: &restart-policy
  restart: unless-stopped
  stop_grace_period: 60s

services:

  msg4wrdsocketio:
    image: ukayra/msg4wrdsocketio:v2.1.1
    container_name: msg4wrdsocketio
    ports:
      - "11203:11203"
    restart: always
    environment:
      SECRET_KEY: ONegCZ9A0il94muzmL1kL6vOYg9sAo81
      FLASK_DEBUG: "false"
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: "11203"
      LOG_LEVEL: info
      LOG_FILE: /app/logs/app.log
      GUNICORN_WORKERS: "1"
      GUNICORN_WORKER_CLASS: eventlet

  valkey9:
    <<: *restart-policy
    image: valkey/valkey:9-alpine
    container_name: valkey9
    mem_limit: ${VALKEY9_MEMORY_LIMIT:-12g}
    ports:
      - "${VALKEY9_BIND_ADDRESS:-127.0.0.1}:${VALKEY9_PORT:-6379}:6379"
    volumes:
      - ./valkey/data:/data
      - ./valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
    command: valkey-server /usr/local/etc/valkey/valkey.conf
    environment:
      TZ: ${TZ:-Asia/Manila}
      SERVICE_TAGS: kpa_valkey9
      SERVICE_NAME: valkey9
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - datastore

networks:
  datastore:
    driver: bridge
