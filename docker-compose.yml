
name: kpa-datastores

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart-policy: &restart-policy
  restart: unless-stopped
  stop_grace_period: 60s

services:
  postgresql18:
    <<: *restart-policy
    image: postgres:18-bookworm
    container_name: postgresql18
    ports:
      - "${POSTGRES18_BIND_ADDRESS:-127.0.0.1}:${POSTGRES18_PORT:-5432}:5432"
    volumes:
      - ./postgresql/data-18:/var/lib/postgresql
    environment:
      POSTGRES_DB: ${POSTGRES18_DB:-app}
      POSTGRES_USER: ${POSTGRES18_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES18_PASSWORD:?Set POSTGRES18_PASSWORD in .env}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --encoding=UTF8 --locale=C.UTF-8"
      PGDATA: /var/lib/postgresql/18/docker
      TZ: ${TZ:-Asia/Manila}
    command:
      - postgres
      - -c
      - password_encryption=scram-sha-256
      - -c
      - max_connections=${POSTGRES18_MAX_CONNECTIONS:-100}
      - -c
      - shared_buffers=${POSTGRES18_SHARED_BUFFERS:-256MB}
      - -c
      - effective_cache_size=${POSTGRES18_EFFECTIVE_CACHE_SIZE:-768MB}
      - -c
      - log_min_duration_statement=${POSTGRES18_LOG_MIN_DURATION_STATEMENT:-1000}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    networks:
      - datastore

networks:
  datastore:
    driver: bridge
