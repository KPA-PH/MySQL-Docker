
name: kpa-datastores

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart-policy: &restart-policy
  restart: unless-stopped
  stop_grace_period: 60s

services:
  mysql84:
    <<: *restart-policy
    image: mysql:8.4
    container_name: mysql84
    ports:
      - "${MYSQL84_BIND_ADDRESS:-127.0.0.1}:${MYSQL84_PORT:-3306}:3306"
    volumes:
      - ./mysql/data-84:/var/lib/mysql
      - ./mysql/my.cnf:/etc/mysql/conf.d/production.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL84_ROOT_PASSWORD:?Set MYSQL84_ROOT_PASSWORD in .env}
      TZ: ${TZ:-Asia/Manila}
      SERVICE_TAGS: kpa_db84
      SERVICE_NAME: mysql84
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${MYSQL84_CPU_LIMIT:-2}"
          memory: ${MYSQL84_MEMORY_LIMIT:-1g}
        reservations:
          cpus: "${MYSQL84_CPU_RESERVATION:-0.5}"
          memory: ${MYSQL84_MEMORY_RESERVATION:-512m}
    networks:
      - datastore

  valkey9:
    <<: *restart-policy
    image: valkey/valkey:9-alpine
    container_name: valkey9
    ports:
      - "${VALKEY9_BIND_ADDRESS:-127.0.0.1}:${VALKEY9_PORT:-6379}:6379"
    volumes:
      - ./valkey/data:/data
      - ./valkey/valkey.conf:/usr/local/etc/valkey/valkey.conf:ro
    command: valkey-server /usr/local/etc/valkey/valkey.conf
    environment:
      TZ: ${TZ:-Asia/Manila}
      SERVICE_TAGS: kpa_valkey9
      SERVICE_NAME: valkey9
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep PONG"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "${VALKEY9_CPU_LIMIT:-1}"
          memory: ${VALKEY9_MEMORY_LIMIT:-512m}
        reservations:
          cpus: "${VALKEY9_CPU_RESERVATION:-0.25}"
          memory: ${VALKEY9_MEMORY_RESERVATION:-128m}
    networks:
      - datastore

networks:
  datastore:
    driver: bridge
